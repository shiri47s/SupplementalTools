plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def generatedResources = file("src/generated")

sourceSets {
    main {
        resources {
            srcDir generatedResources
            // Datagen's hash cache is a build artifact, not a shipped resource.
            exclude '.cache/**'
        }
    }
    // Data generation code is compiled and run, but never shipped in the mod jar.
    datagen {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    // NeoForge discovers @EventBusSubscriber by scanning the mod's paths, so the
    // datagen source set must be registered as part of the mod in dev runs.
    mods {
        register(rootProject.mod_id) {
            sourceSet sourceSets.main
            sourceSet sourceSets.datagen
        }
    }

    runs {
        Datagen {
            clientData()
            source sourceSets.datagen
            programArgs "--all", "--mod", rootProject.mod_id
            programArgs "--output", generatedResources.absolutePath
        }
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Trinkets Updated is deliberately absent from NeoForge dev runs: its 4.1.0+26.2
    // NeoForge mixins target LivingEntity.canGlide(Z)Z, which does not exist in
    // neoforge 26.2.0.7-beta (26.2 declares canGlide()Z), so loading it aborts every
    // run. This only affects dev runtime - the integration is compileOnly and users on
    // a newer NeoForge are unaffected. Re-add once neoforge_version is bumped.

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null

    // common's data generation helpers reference client-only Minecraft classes and are
    // only needed by the datagen source sets, so keep them out of the shipped jar.
    exclude 'net/syshima/sptools/datagen/**'
}

tasks.named('assemble') { dependsOn tasks.named('shadowJar') }
