plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
    id "com.matthewprenger.cursegradle" version "1.4.0" apply false
    id "com.modrinth.minotaur" version "2.9.0" apply false
}


architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {apply plugin: "dev.architectury.loom-no-remap"

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_name
    }
    version = rootProject.mod_version + "_" + rootProject.minecraft_version + "-" + project.name
    group = rootProject.maven_group

    repositories {
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.nucleoid.xyz/releases" }   // Trinkets Updated
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }

        withSourcesJar()
    }
}

subprojects {
    if (!enabled_platforms.split(',').contains(project.name))
        return

    def RELEASE = project.release_type

    def CHANGE_LOG = rootProject.file('changelog.md').getText("UTF-8")
    def PUBLISH_NAME = "${project.archives_name}-v${project.mod_version}_${project.minecraft_version}-${project.name}"
    def MOD_LOADER = project.name

    apply plugin: "com.modrinth.minotaur"
    modrinth {
        def MODRINTH_TOKEN = System.getenv("MODRINTH_TOKEN")
        if (MODRINTH_TOKEN != null) {
            token = MODRINTH_TOKEN
            projectId = project.modrinth_id
            versionName = PUBLISH_NAME
            // Must be unique per project: both loaders previously uploaded "3.0.0".
            versionNumber = "${project.mod_version}+${project.minecraft_version}-${MOD_LOADER}"
            versionType = RELEASE
            uploadFile = project.provider { project.tasks.named("shadowJar").get() }
            changelog = CHANGE_LOG
            gameVersions = ["${project.minecraft_version}"]
            loaders = [MOD_LOADER]
            dependencies {
                required.project "architectury-api"
                optional.project "trinkets-updated"
                if (MOD_LOADER.equalsIgnoreCase('fabric')) {
                    required.project "fabric-api"
                    optional.project "lambdynamiclights"
                }
            }
        }
    }

    apply plugin: "com.matthewprenger.cursegradle"
    curseforge {
        def CURSEFORGE_TOKEN = System.getenv("CURSEFORGE_TOKEN")
        if (CURSEFORGE_TOKEN != null) {
            apiKey = CURSEFORGE_TOKEN
            //noinspection GroovyAssignabilityCheck
            project {
                id = project.curseforge_id
                releaseType = RELEASE
                changelogType = "markdown"
                changelog = CHANGE_LOG
                project.support_versions.split(',').each { addGameVersion it.trim() }

                relations {
                    requiredDependency 'architectury-api'
                    optionalDependency 'trinkets-updated'
                    if (MOD_LOADER.equalsIgnoreCase('fabric')) {
                        requiredDependency 'fabric-api'
                        optionalDependency 'lambdynamiclights'
                    }
                }

                afterEvaluate {
                    mainArtifact(tasks.named("shadowJar").get()) {
                        displayName = PUBLISH_NAME
                    }
                    uploadTask.dependsOn("build")
                }
            }
            options {
                forgeGradleIntegration = false
                javaVersionAutoDetect = true
            }
        }
    }
}
