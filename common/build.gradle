architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Available for the Fabric @Environment annotations, which get remapped to the
    // correct annotation on each platform. Nothing in common needs them today - side
    // separation goes through Architectury's EnvExecutor instead - so if you reach for
    // this, annotate only; do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Optional accessory-slot integration. Compile-time only: the mod runs fine without it
    // and the classes are never loaded unless Trinkets Updated is present.
    // loom-no-remap does not register the mod* configurations; the artifact is
    // already Mojmap so a plain compileOnly is correct here.
    compileOnly "eu.pb4:trinkets:$rootProject.trinkets_version"
}
